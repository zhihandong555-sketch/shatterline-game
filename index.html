<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>碎光 Shatterline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a10; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #app { position: fixed; inset: 0; }
    canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    canvas#crack {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 5;
    }

    /* ---------- HUD ---------- */
    #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    #hud.hurt-flash::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(255, 60, 60, 0.35) 100%);
      animation: flash 0.5s ease-out forwards;
    }
    @keyframes flash { from { opacity: 1; } to { opacity: 0; } }

    #topbar {
      position: absolute; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 22px;
      color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,0.5);
    }
    #dist { font-size: 22px; font-weight: 700; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
    #score { font-size: 22px; font-weight: 700; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
    .toplabel { display: block; font-size: 10px; font-weight: 500; opacity: 0.65; letter-spacing: 3px; margin-bottom: 2px; }

    #crosshair {
      position: absolute; left: 50%; top: 50%; width: 34px; height: 34px;
      transform: translate(-50%, -50%); opacity: 0.85;
    }
    #crosshair::before {
      content: ""; position: absolute; inset: 0; border: 1.5px solid rgba(255,255,255,0.9);
      border-radius: 50%; box-shadow: 0 0 6px rgba(255,255,255,0.35);
    }
    #crosshair::after {
      content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px;
      transform: translate(-50%, -50%); background: #fff; border-radius: 50%;
    }

    #life {
      position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      color: #fff; text-shadow: 0 1px 12px rgba(0,0,0,0.6);
    }
    #lifeNum { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; transition: color 0.2s; }
    #life.low #lifeNum { color: #ffb340; }
    #life.critical #lifeNum { color: #ff4b4b; animation: pulse 0.7s infinite; }
    @keyframes pulse { 50% { opacity: 0.45; } }

    #multiball {
      position: absolute; bottom: max(84px, calc(env(safe-area-inset-bottom) + 64px)); left: 50%; transform: translateX(-50%);
      color: #6ef2ff; font-size: 14px; font-weight: 700; letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(80, 220, 255, 0.8); opacity: 0; transition: opacity 0.3s;
    }
    #multiball.on { opacity: 1; }

    #banner {
      position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%);
      text-align: center; color: #fff; opacity: 0; pointer-events: none;
      transition: opacity 0.4s, transform 0.4s;
    }
    #banner.show { opacity: 1; transform: translate(-50%, -60%); }
    #bannerTitle { font-size: 34px; font-weight: 800; letter-spacing: 8px; text-shadow: 0 0 18px rgba(255,255,255,0.55); }
    #bannerSub { font-size: 14px; letter-spacing: 4px; opacity: 0.8; margin-top: 6px; }

    .floater {
      position: absolute; transform: translate(-50%, -50%);
      color: #fff; font-weight: 700; font-size: 17px; pointer-events: none;
      text-shadow: 0 1px 6px rgba(0,0,0,0.55);
      animation: floatUp 0.8s ease-out forwards;
    }
    .floater.gem { color: #6ef2ff; }
    @keyframes floatUp {
      from { opacity: 1; margin-top: 0; }
      to { opacity: 0; margin-top: -46px; }
    }

    /* ---------- 覆盖层（菜单 / 结束） ---------- */
    .overlay {
      position: absolute; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(8, 10, 16, 0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      color: #fff; text-align: center; transition: opacity 0.4s;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .title-zh { font-size: clamp(52px, 12vw, 96px); font-weight: 900; letter-spacing: 18px; margin-left: 18px;
      background: linear-gradient(120deg, #bfe8ff 10%, #6ea8ff 45%, #d576ff 85%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 24px rgba(110, 168, 255, 0.35));
    }
    .title-en { font-size: 15px; letter-spacing: 10px; margin-left: 10px; opacity: 0.7; margin-top: 4px; text-transform: uppercase; }
    .menu-desc { margin-top: 30px; font-size: 14px; line-height: 2.1; opacity: 0.85; letter-spacing: 1px; }
    .menu-best { margin-top: 18px; font-size: 13px; opacity: 0.6; letter-spacing: 2px; }
    .btn {
      margin-top: 34px; padding: 15px 58px; font-size: 17px; font-weight: 700; letter-spacing: 6px;
      color: #0b1420; background: linear-gradient(135deg, #9fd8ff, #5f9dff);
      border: none; border-radius: 40px; cursor: pointer; pointer-events: auto;
      box-shadow: 0 6px 28px rgba(95, 157, 255, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 34px rgba(95, 157, 255, 0.6); }
    .btn:active { transform: translateY(0); }
    .btn.secondary {
      background: rgba(255,255,255,0.1); color: #dfe8f4; margin-left: 16px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35);
    }
    .over-title { font-size: 42px; font-weight: 900; letter-spacing: 12px; margin-left: 12px; color: #ff7d7d; }
    .over-stats { margin-top: 28px; display: flex; gap: 46px; }
    .stat { display: flex; flex-direction: column; gap: 6px; }
    .stat b { font-size: 30px; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 11px; letter-spacing: 3px; opacity: 0.6; }
    .newbest { margin-top: 16px; color: #ffd76e; font-size: 14px; letter-spacing: 3px; text-shadow: 0 0 12px rgba(255, 215, 110, 0.7); }
    .hint-line { margin-top: 26px; font-size: 12px; opacity: 0.5; letter-spacing: 2px; }
  </style>
  <script type="module" crossorigin src="./assets/index-BZjfVS_O.js"></script>
</head>
<body>
  <div id="app">
    <canvas id="gl"></canvas>
    <canvas id="crack"></canvas>

    <div id="hud">
      <div id="topbar">
        <div><span class="toplabel">距离</span><span id="dist">0 m</span></div>
        <div style="text-align:right"><span class="toplabel">连击</span><span id="comboTop">×0</span></div>
      </div>
      <div id="crosshair"></div>
      <div id="multiball">多重球 ×1</div>
      <div id="life"><span id="lifeNum">100</span></div>
      <div id="banner"><div id="bannerTitle"></div><div id="bannerSub"></div></div>
    </div>

    <div id="menu" class="overlay">
      <div class="title-zh">碎光</div>
      <div class="title-en">Shatterline</div>
      <div class="menu-desc">
        全速前进，投掷钢球击碎沿途玻璃得分<br />
        每次投掷消耗 1 分，击中目标加分，撞上障碍扣 20+ 分<br />
        分数归零即终结 —— 速度会越来越快，祝你好运
      </div>
      <div class="menu-best" id="bestMenu"></div>
      <button class="btn" id="btnStart">开始</button>
      <div class="hint-line">点击 / 触摸屏幕任意位置投球</div>
    </div>

    <div id="gameover" class="overlay hidden">
      <div class="over-title">分数耗尽</div>
      <div class="over-stats">
        <div class="stat"><b id="goScore">0</b><span>最终分数</span></div>
        <div class="stat"><b id="goDist">0 m</b><span>距离</span></div>
        <div class="stat"><b id="goBest">0</b><span>最佳分数</span></div>
      </div>
      <div class="newbest hidden" id="newBest">★ 新纪录 ★</div>
      <div>
        <button class="btn" id="btnRetry">从检查点继续</button>
        <button class="btn secondary" id="btnRestart">重新开始</button>
      </div>
    </div>
  </div>
</body>
</html>
